services:
  db:
    image: postgres:16-alpine
    container_name: resume_analyzer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_analyzer
    ports:
      - "5432:5432"
    volumes:
      - resume_pg_data:/var/lib/postgresql/data

volumes:
  resume_pg_data:
